<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSpace Converter API</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      border: 2px dashed #667eea;
      border-radius: 8px;
      background: #f8f9ff;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #667eea;
      font-weight: 600;
    }

    .file-input-label:hover {
      background: #f0f2ff;
      border-color: #764ba2;
    }

    .file-input-label.dragging {
      background: #e8ebff;
      border-color: #764ba2;
    }

    .file-name {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .result.loading {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }

    .result h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .result p {
      word-break: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .download-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .download-link:hover {
      background: #218838;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 DSpace Converter</h1>
    <p class="subtitle">Converta input-forms.xml de DSpace 5 para DSpace 9</p>

    <form id="uploadForm">
      <div class="form-group">
        <label>Selecione o arquivo input-forms.xml</label>
        <div class="file-input-wrapper">
          <input type="file" id="fileInput" name="file" accept=".xml" required>
          <div class="file-input-label" id="fileLabel">
            📁 Clique ou arraste o arquivo aqui
          </div>
          <div class="file-name" id="fileName"></div>
        </div>
      </div>

      <button type="submit" id="submitBtn">Converter</button>
    </form>

    <div class="result" id="result">
      <h3 id="resultTitle"></h3>
      <p id="resultMessage"></p>
      <a href="#" class="download-link" id="downloadLink" style="display: none;">
        ⬇️ Baixar resultado
      </a>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const fileName = document.getElementById('fileName');
    const uploadForm = document.getElementById('uploadForm');
    const result = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');
    const downloadLink = document.getElementById('downloadLink');

    // Drag and drop
    fileLabel.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileLabel.classList.add('dragging');
    });

    fileLabel.addEventListener('dragleave', () => {
      fileLabel.classList.remove('dragging');
    });

    fileLabel.addEventListener('drop', (e) => {
      e.preventDefault();
      fileLabel.classList.remove('dragging');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        updateFileName();
      }
    });

    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
      const file = fileInput.files[0];
      if (file) {
        fileName.textContent = `✓ ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
      } else {
        fileName.textContent = '';
      }
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) {
        showError('Por favor selecione um arquivo');
        return;
      }

      submitBtn.disabled = true;
      showLoading('Processando conversão...');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('http://localhost:3000/api/v1/conversions', {
          method: 'POST',
          body: formData,
        });

        if (response.ok) {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.download = 'dspace-conversion.zip';
          downloadLink.style.display = 'inline-block';

          resultTitle.textContent = '✅ Sucesso!';
          resultMessage.textContent = 'Seu arquivo foi convertido com sucesso. Clique no botão abaixo para baixar.';
          result.classList.remove('loading', 'error');
          result.classList.add('success', 'show');
        } else {
          const errorData = await response.json();
          const errorMessage = errorData.error?.message || 'Erro desconhecido na conversão';
          showError(errorMessage);
        }
      } catch (error) {
        showError(`Erro na requisição: ${error.message}`);
      } finally {
        submitBtn.disabled = false;
      }
    });

    function showLoading(message) {
      resultTitle.innerHTML = '<span class="spinner"></span>Processando...';
      resultMessage.textContent = message;
      downloadLink.style.display = 'none';
      result.classList.remove('success', 'error');
      result.classList.add('loading', 'show');
    }

    function showError(message) {
      resultTitle.textContent = '❌ Erro';
      resultMessage.textContent = message;
      downloadLink.style.display = 'none';
      result.classList.remove('success', 'loading');
      result.classList.add('error', 'show');
    }
  </script>
</body>
</html>
